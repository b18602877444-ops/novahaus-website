<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVAHAUS C2 Logo Check</title>
    <style>
      :root { color: #fff; background: #0b0b0b; font-family: Inter, Arial, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(900px, calc(100% - 48px)); }
      h1 { margin: 0 0 12px; font-size: 28px; font-weight: 500; letter-spacing: -.04em; }
      p { margin: 0 0 32px; color: #9a978e; font-size: 14px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
      figure { margin: 0; padding: 28px; background: #151515; border: 1px solid rgba(255,255,255,.14); border-radius: 20px; }
      .preview { display: grid; min-height: 310px; place-items: center; background-color: #fafaf8; background-image: linear-gradient(45deg, #e7e5df 25%, transparent 25%), linear-gradient(-45deg, #e7e5df 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e7e5df 75%), linear-gradient(-45deg, transparent 75%, #e7e5df 75%); background-position: 0 0, 0 8px, 8px -8px, -8px 0; background-size: 16px 16px; }
      .preview img { width: 230px; height: 230px; object-fit: contain; }
      figcaption { margin-top: 18px; color: #c8a24a; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>C2 Monogram Verification</h1>
      <p>The selected C2 preview is compared with the transparent website mark extracted from the same asset.</p>
      <div class="grid">
        <figure>
          <div class="preview"><img src="/Brand_Identity/Logo/Preview_v3/NOVAHAUS_C2.png" alt="Selected C2 logo preview" /></div>
          <figcaption>Selected C2 · /Brand_Identity/Logo/Preview_v3/NOVAHAUS_C2.png</figcaption>
        </figure>
        <figure>
          <div class="preview"><img src="/novahaus-mark.png" alt="Website C2 mark" /></div>
          <figcaption>Website mark · /novahaus-mark.png</figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
